# Environment for building the documentation.  It holds Sphinx and its
# extensions and nothing else: the docs document the command-line interface
# rather than importing the package, and take the version from pyproject.toml,
# so neither this package nor any of its dependencies -- CDO least of all --
# has to be installed to build them.  See "Building the documentation" in the
# developer guide.
name: ismip7-interp-docs
channels:
  - conda-forge
  # Never let a user's `defaults` channel leak into the solve: it would give
  # different builds on different machines.
  - nodefaults

dependencies:
  # tomllib, which conf.py uses to read the version, is in the standard
  # library from 3.11
  - python >=3.11,<3.15
  - sphinx >=8
  - myst-parser >=4
  - furo
  - sphinx-copybutton
  - sphinx-design
