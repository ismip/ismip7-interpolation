name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cdo, netcdf-bin (ncgen) and bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y cdo netcdf-bin bats

      - name: Generate synthetic test fixtures
        run: bash tests/fixtures/make_fixtures.sh

      - name: Run unit tests
        run: bats tests/unit/

      - name: Run smoke tests
        run: bats tests/smoke/
